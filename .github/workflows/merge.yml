name: "IR Vulnerable Package Test"
  
  on:
    workflow_dispatch:
  
  permissions:
    checks: write
    actions: read
    contents: read
    id-token: write
  
  jobs:
    vulnerable-package:
      runs-on: ubuntu-latest
      container:
        image: python:3.11
      steps:
        - name: Setup PSE
          uses: invisirisk/pse-action@latest
          with:
            api_url: "https://app.invisirisk.com"
            app_token: ofQqVg-9_Vcv96Oc7DfMQusKkHz7xnsk1TaWgNBOj6vEPc1olC5Kzc_iZqiPP_xMAXzPkZkxKx0LGMNNl66RWw
  
        # 1 request -> 1 response (the starlette 0.37.2 wheel)
        - name: Download starlette 0.37.2
          run: |
            curl -sS -o starlette-0.37.2-py3-none-any.whl \
              -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" \
              https://files.pythonhosted.org/packages/fd/18/31fa32ed6c68ba66220204ef0be798c349d0a20c1901f9d4a794e08c76d8/starlette-0.37.2-py3-none-any.whl

  name: "IR One Request One Response"
  
  on:
    workflow_dispatch:
  
  permissions:
    checks: write
    actions: read
    contents: read
    id-token: write
  
  jobs:
    one-request-one-response:
      runs-on: ubuntu-latest
      container:
        image: python:3.11
      steps:
        # ============= InvisiRisk Setup =============
        - name: Setup PSE
          uses: invisirisk/pse-action@latest
          with:
            api_url: "https://app.invisirisk.com"
            app_token: ofQqVg-9_Vcv96Oc7DfMQusKkHz7xnsk1TaWgNBOj6vEPc1olC5Kzc_iZqiPP_xMAXzPkZkxKx0LGMNNl66RWw
        # ============= InvisiRisk Setup End =============
  
        # 1 request (GET wheel) -> 1 response (200 OK + wheel file)
        - name: Download starlette 0.37.2
          run: |
            curl -sS -o starlette-0.37.2-py3-none-any.whl \
              -w "status=%{http_code} size=%{size_download}\n" \
              https://files.pythonhosted.org/packages/fd/18/31fa32ed6c68ba66220204ef0be798c349d0a20c1901f9d4a7e08c76d8/starlette-0.37.2-py3-none-any.whl

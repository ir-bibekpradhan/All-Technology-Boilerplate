  name: "IR Response Policy Test"
  
  on:
    workflow_dispatch:
  
  permissions:
    checks: write
    actions: read
    contents: read
    id-token: write
  
  jobs:
    response-policy:
      runs-on: ubuntu-latest
      container:
        image: python:3.11
      steps:
        - name: Setup PSE
          uses: invisirisk/pse-action@latest
          with:
            api_url: "https://app.invisirisk.com"
            app_token: ofQqVg-9_Vcv96Oc7DfMQusKkHz7xnsk1TaWgNBOj6vEPc1olC5Kzc_iZqiPP_xMAXzPkZkxKx0LGMNNl66RWw
  
        # 1 request -> response is 2048 bytes, type application/octet-stream
        - name: One request with a response the policy can match
          run: |
            curl -sS -o out.bin \
              -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" \
              https://httpbin.org/bytes/2048

name: "Combined Multi-Stage Deployment- pranesh"

on:
  workflow_dispatch:
    inputs:
      JAVASCRIPT_PACKAGE_MANAGER:
        description: "JavaScript package manager"
        type: choice
        default: "npm"
        options: ["npm", "pnpm", "yarn", "bun"]
      PYTHON_VERSION:
        description: "Python version"
        type: choice
        default: "3.11"
        options: ["3.9", "3.10", "3.11", "3.12"]
      DOTNET_VERSION:
        description: ".NET version"
        type: choice
        default: "8.0"
        options: ["6.0", "7.0", "8.0"]
      GO_VERSION:
        description: "Go version"
        type: choice
        default: "1.22"
        options: ["1.20", "1.21", "1.22"]
      JAVA_VERSION:
        description: "Java version"
        type: choice
        default: "17"
        options: ["11", "17", "21"]
      PHP_VERSION:
        description: "PHP version"
        type: choice
        default: "8.2"
        options: ["8.1", "8.2", "8.3"]
      RUBY_VERSION:
        description: "Ruby version"
        type: choice
        default: "3.3"
        options: ["3.0", "3.1", "3.2", "3.3"]
      SKIP_JAVASCRIPT:
        description: "Skip JavaScript"
        type: boolean
        default: false
      SKIP_PYTHON:
        description: "Skip Python"
        type: boolean
        default: false
      SKIP_DOTNET:
        description: "Skip .NET"
        type: boolean
        default: false
      SKIP_GO:
        description: "Skip Go"
        type: boolean
        default: false
      SKIP_JAVA:
        description: "Skip Java"
        type: boolean
        default: false
      SKIP_PHP:
        description: "Skip PHP"
        type: boolean
        default: false
      SKIP_RUBY:
        description: "Skip Ruby"
        type: boolean
        default: false

permissions:
  checks: write
  actions: read
  contents: read
  id-token: write

# ============= Build all technologies in parallel =============

jobs:
  build-javascript:
    if: ${{ inputs.SKIP_JAVASCRIPT != true }}
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl

      - name: Build & test
        working-directory: javascript
        run: |
          case "${{ inputs.JAVASCRIPT_PACKAGE_MANAGER }}" in
            pnpm) npm install -g pnpm && pnpm install && pnpm run build && pnpm test ;;
            yarn) yarn install && yarn run build && yarn test ;;
            bun)  npm install -g bun && bun install && bun run build && bun test ;;
            *)    npm install --legacy-peer-deps && npm run build && npm test ;;
          esac

  build-python:
    if: ${{ inputs.SKIP_PYTHON != true }}
    runs-on: ubuntu-latest
    container:
      image: python:${{ inputs.PYTHON_VERSION || '3.11' }}
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl

      - name: Build & test
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          pytest tests/ -v
          pip install build && python -m build
          sleep 120

  build-dotnet:
    if: ${{ inputs.SKIP_DOTNET != true }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:${{ inputs.DOTNET_VERSION || '8.0' }}
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl

      - name: Build & test
        working-directory: dotnet
        run: |
          dotnet restore
          dotnet build DotnetBoilerplate.sln --no-restore --configuration Release
          dotnet test Tests/DotnetBoilerplate.Tests.csproj --no-build --verbosity normal || dotnet test Tests/DotnetBoilerplate.Tests.csproj --verbosity normal

  build-go:
    if: ${{ inputs.SKIP_GO != true }}
    runs-on: ubuntu-latest
    container:
      image: golang:${{ inputs.GO_VERSION || '1.22' }}
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl

      - name: Build & test
        working-directory: go
        run: |
          # Container runs as root but the checkout is owned by the runner user (uid 1001);
          # git refuses the repo ("dubious ownership"), which breaks Go's VCS stamping.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pwd
          ls -la
          go mod download
          go mod verify
          go build -buildvcs=false -v ./...
          go test -buildvcs=false -v ./...
          go vet ./...

  build-java:
    if: ${{ inputs.SKIP_JAVA != true }}
    runs-on: ubuntu-latest
    container:
      image: maven:3.9-eclipse-temurin-${{ inputs.JAVA_VERSION || '17' }}
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl

      - name: Build & test
        working-directory: java-maven
        run: |
          mvn -U clean compile
          mvn test
          mvn package -DskipTests

  build-php:
    if: ${{ inputs.SKIP_PHP != true }}
    runs-on: ubuntu-latest
    container:
      image: php:${{ inputs.PHP_VERSION || '8.2' }}-cli
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl git unzip
      - name: Install Composer
        run: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Build & test
        working-directory: php
        run: |
          composer validate --strict
          composer install --prefer-dist --no-progress
          vendor/bin/phpstan analyse src --level=5 || true
          vendor/bin/phpunit tests/

  build-ruby:
    if: ${{ inputs.SKIP_RUBY != true }}
    runs-on: ubuntu-latest
    container:
      image: ruby:${{ inputs.RUBY_VERSION || '3.3' }}
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: WQVCk58t1YB0Otg15UweVUL88Sk_8xML31pxACCfk0pkM9ntHufL5PlBSOmIp7F_aXzYLceYJ_cUnkLU93a-vg
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl

      - name: Build & test
        working-directory: ruby
        run: |
          bundle install
          bundle exec rubocop --format progress || true
          bundle exec rspec spec/
